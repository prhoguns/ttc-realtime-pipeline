name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: ttc, POSTGRES_USER: ttc, POSTGRES_PASSWORD: ttc }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U ttc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - name: Apply schema
        run: PGPASSWORD=ttc psql -h localhost -p 5434 -U ttc -d ttc -f sql/schema.sql
      - run: pytest -q
        env:
          POSTGRES_DSN: host=localhost port=5434 dbname=ttc user=ttc password=ttc
